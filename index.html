<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Brawl Stars — Beta Menu</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #071b35;
    color: white;
}

body {
    background:
        radial-gradient(circle at 50% 30%, #174d80 0%, #0a2b4e 38%, #06182e 100%);
}

.game {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

/* Верхня панель */

.top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 74px;
    display: flex;
    align-items: center;
    padding: 10px 14px;
    z-index: 5;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.profile-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #174d7a;
    border: 2px solid #58b8ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.player-name {
    font-size: 17px;
    font-weight: bold;
}

.trophies {
    font-size: 13px;
    color: #ffd34e;
    margin-top: 3px;
}

.resources {
    margin-left: auto;
    display: flex;
    gap: 7px;
}

.resource {
    min-width: 64px;
    padding: 7px 9px;
    border-radius: 9px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.16);
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

/* Центральний персонаж */

.character-area {
    position: absolute;
    left: 50%;
    top: 82px;
    transform: translateX(-50%);
    width: 100%;
    height: 45%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.character {
    max-width: 72%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 12px 10px rgba(0,0,0,.45));
}

/* Картка бійця */

.player-card {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 48%;
    min-height: 82px;
    border-radius: 15px;
    background: linear-gradient(135deg,#15578b,#0c345a);
    border: 2px solid #54b9ff;
    box-shadow: 0 7px 18px rgba(0,0,0,.35);
    padding: 12px 15px;
}

.card-title {
    font-size: 12px;
    color: #9bd8ff;
    font-weight: bold;
}

.card-name {
    font-size: 23px;
    font-weight: 900;
    margin-top: 3px;
}

.card-rank {
    position: absolute;
    right: 15px;
    top: 16px;
    font-size: 13px;
    color: #ffd84a;
    font-weight: bold;
}

/* Подія */

.event {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 125px;
    height: 112px;
    border-radius: 15px;
    overflow: hidden;
    background: linear-gradient(135deg,#294e72,#122c4c);
    border: 2px solid rgba(255,255,255,.22);
    box-shadow: 0 7px 18px rgba(0,0,0,.35);
}

.event-info {
    padding: 11px 14px;
}

.event-small {
    color: #9bd8ff;
    font-size: 11px;
    font-weight: bold;
}

.event-title {
    font-size: 20px;
    font-weight: 900;
    margin-top: 3px;
}

.event-map {
    font-size: 13px;
    color: #d3e7f7;
    margin-top: 4px;
}

.play {
    position: absolute;
    right: 12px;
    bottom: 11px;
    background: #e9a91c;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 900;
}

/* Токени */

.token-area {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 92px;
}

.token-text {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 5px;
    color: #d9ecff;
}

.token-bar {
    width: 100%;
    height: 11px;
    background: rgba(0,0,0,.45);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.2);
}

.token-fill {
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg,#38a9ff,#ffd52f);
}

/* Нижня панель */

.bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    background: rgba(3,15,30,.96);
    border-top: 2px solid rgba(255,255,255,.14);
    z-index: 10;
}

.nav {
    border: 0;
    background: transparent;
    color: #9db1c5;
    font-size: 11px;
    font-weight: bold;
}

.nav span {
    display: block;
    font-size: 22px;
    margin-bottom: 3px;
}

.nav.active {
    color: #ffd33d;
}

.notice {
    position: absolute;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.88);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    z-index: 20;
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="game">

    <div class="top">

        <div class="profile">
            <div class="profile-icon">👤</div>

            <div>
                <div class="player-name">Smwdev</div>
                <div class="trophies">🏆 0</div>
            </div>
        </div>

        <div class="resources">
            <div class="resource">🪙 1000</div>
            <div class="resource">💎 0</div>
            <div class="resource">⭐ 0</div>
        </div>

    </div>

    <div class="character-area">
        <img
            class="character"
            src="barley_default_001.png"
            alt="Barley"
        >
    </div>

    <div class="event">

        <div class="event-info">
            <div class="event-small">ПОТОЧНА ПОДІЯ</div>
            <div class="event-title">ОДИНОЧНЕ ЗІТКНЕННЯ</div>
            <div class="event-map">Дика місцевість</div>
        </div>

        <button class="play" onclick="showNotice('Гра запускається...')">
            ГРАТИ
        </button>

    </div>

    <div class="token-area">

        <div class="token-text">
            <span>ЖЕТОНИ</span>
            <span>45 / 100</span>
        </div>

        <div class="token-bar">
            <div class="token-fill"></div>
        </div>

    </div>

    <div class="bottom">

        <button class="nav" onclick="showNotice('Магазин')">
            <span>🛒</span>
            Магазин
        </button>

        <button class="nav" onclick="showNotice('Профіль')">
            <span>👤</span>
            Профіль
        </button>

        <button class="nav active" onclick="showNotice('Грати')">
            <span>⚔️</span>
            Грати
        </button>

        <button class="nav" onclick="showNotice('Налаштування')">
            <span>⚙️</span>
            Налаштування
        </button>

    </div>

    <div id="notice" class="notice"></div>

</div>

<script>
function showNotice(text) {
    const notice = document.getElementById("notice");

    notice.textContent = text;
    notice.style.display = "block";

    clearTimeout(window.noticeTimer);

    window.noticeTimer = setTimeout(() => {
        notice.style.display = "none";
    }, 1200);
}
</script>

</body>
</html>
